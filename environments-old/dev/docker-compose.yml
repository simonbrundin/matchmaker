services:
  postgres:
    image: postgres:16-alpine
    container_name: matchmaker-dev-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matchmaker_test
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/mock-data.sql:/docker-entrypoint-initdb.d/02-mock-data.sql:ro
      - matchmaker-dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matchmaker_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  matchmaker-dev-postgres-data: