apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
    disableNameSuffixHash: true

secretGenerator:
    - name: matchmaker-secrets
      literals:
          - supabase-url=REPLACE_WITH_URL
          - supabase-anon-key=REPLACE_WITH_ANON_KEY
          - supabase-service-role-key=REPLACE_WITH_SERVICE_ROLE_KEY
          - sms-gateway-api-key=REPLACE_WITH_SMS_KEY
          - telegram-bot-token=REPLACE_WITH_BOT_TOKEN
          - admin-telegram-chat-id=REPLACE_WITH_CHAT_ID
          - openai-api-key=REPLACE_WITH_OPENAI_KEY
