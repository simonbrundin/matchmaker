services:
  postgres:
    image: postgres:16-alpine
    container_name: matchmaker-dev-postgres
    ports:
      - "::5432"
    environment:
      POSTGRES_USER: matchmaker
      POSTGRES_PASSWORD: matchmaker
      POSTGRES_DB: matchmaker
    volumes:
      - matchmaker-postgres-data:/var/lib/postgresql/data
      - ../../prod/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmaker -d matchmaker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  matchmaker-postgres-data:
